<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reportes de checklist</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#111827;--mut:#6b7280;--bd:#d1d5db;--pri:#2563eb;--ok:#16a34a;--no:#dc2626;--na:#6b7280;--pen:#9ca3af;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mut:#9ca3af;--bd:#374151;--pri:#3b82f6}}
:root[data-theme="dark"]{--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mut:#9ca3af;--bd:#374151;--pri:#3b82f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
h3{font-size:16px;margin:14px 0 8px}
input,textarea,select{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:8px;font:inherit}
.card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:12px;border:1px solid var(--bd)}
.act{font-weight:600;margin-bottom:8px}
.btn{background:var(--pri);color:#fff;border:0;padding:10px 14px;border-radius:8px;cursor:pointer;margin:3px 3px 3px 0;font:inherit}
.btn.g{background:var(--na)}.btn.r{background:var(--no)}
.est{display:block;width:100%;color:#fff;border:0;border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer;font:inherit}
.foto img{max-width:100%;max-height:260px;border-radius:8px;display:block;margin-bottom:6px}
.row{display:flex;gap:6px;align-items:center}.row input,.row select{margin:0}
.mut{color:var(--mut);font-size:14px}
.sec{margin:10px 0}
#toast{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:12px;border-radius:8px;display:none;z-index:20;text-align:center}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:30}
#modal .box{background:var(--card);padding:18px;border-radius:10px;max-width:320px;margin:12px}

.hd{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#1e3a5f,#2563eb);color:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.hd img{width:48px;height:48px;border-radius:10px;background:#fff;padding:3px;object-fit:contain}
.hd h1{font-size:20px;margin:0;color:#fff}.hd small{opacity:.9;text-transform:capitalize}
nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
nav button{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 12px;border:0;border-radius:14px;color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25);opacity:.75;transition:.15s}
nav button.on{opacity:1;outline:3px solid rgba(255,255,255,.85);transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.35)}
nav button .ic{font-size:28px;line-height:1.2}
nav button small{font-weight:400;font-size:12px}
nav button .bd{position:absolute;top:8px;right:8px;background:#fff;color:#dc2626;border-radius:999px;font-size:11px;font-weight:700;padding:1px 8px}

input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.3)}
.card,.sc{border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.lb{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:2px 0 4px;letter-spacing:.4px}
.sc{padding:14px;margin-bottom:14px;background:var(--card);border:1px solid var(--bd)}
.sc .ttl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 select,.g2 input{margin-bottom:0}
.ac{border-left:6px solid var(--pen);border-top:1px solid var(--bd);border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.ac .g2{margin-bottom:10px}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.addf{display:block;width:100%;background:transparent;color:var(--pri);border:2px dashed var(--pri);border-radius:12px;padding:12px;font:inherit;font-weight:600;cursor:pointer;margin-top:4px}
.fotos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0}
.foto{border:1px solid var(--bd);border-radius:12px;padding:8px;background:var(--bg)}.foto textarea{margin:6px 0}
.bar{position:sticky;bottom:0;z-index:10;display:flex;gap:8px;padding:12px 0 4px;background:linear-gradient(to top,var(--bg) 75%,transparent)}
.bar .btn{flex:1;margin:0;padding:14px;font-weight:700}

.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g2 .btn,.g3 .btn{width:100%;margin:0;padding:12px 6px}
.ac .lb{margin-top:2px}

input[type=date],input[type=time]{min-height:44px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) input[type=date],:root:not([data-theme="light"]) input[type=time]{color-scheme:dark}}
:root[data-theme="dark"] input[type=date],:root[data-theme="dark"] input[type=time]{color-scheme:dark}
input.pk{cursor:pointer}

.hbtn{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:10px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
.hint{background:rgba(37,99,235,.12);border:1px solid rgba(37,99,235,.35);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;line-height:1.4}
#tour{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:40}
#tour .box{background:var(--card);padding:20px;border-radius:16px;max-width:360px;margin:12px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
details summary{list-style:none}details summary::before{content:'▸ ';color:var(--pri)}details[open] summary::before{content:'▾ '}
</style>
</head>
<body>
<main><div id="app"></div></main>
<input type="file" id="fl" accept="image/*" hidden>
<input type="file" id="fr" accept=".json,application/json" hidden>
<input type="file" id="fi" accept="image/*" capture="environment" multiple hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const ESTADOS=['Pendiente','Cumple','No cumple','N/A'];
const folioNuevo=()=>{const u=new Set();[...S.reportes,...(S.rep?[S.rep]:[])].forEach(r=>r.items.forEach(i=>i.folio&&u.add(String(i.folio))));let f;do{f=String(10000+Math.floor(Math.random()*90000))}while(u.has(f));return f};
const histLista=rg=>!rg.length?'<div class="sc"><p class="mut" style="margin:0">Aún no hay reportes en esta vista. Toca 📝 Nuevo reporte para crear el primero.</p></div>':rg.slice().reverse().map(r=>{const a=r.items.length-r.items.filter(i=>i.estado==='N/A').length,p=a?Math.round(r.items.filter(i=>i.estado==='Cumple').length/a*100):0,cl=p>=90?'var(--ok)':p>=70?'#d97706':'var(--no)',nf=r.items.reduce((q,i)=>q+i.fotos.length,0);
  return `<div class="ac" style="border-left-color:${cl}"><div class="row sec" style="justify-content:space-between"><span class="chip">${r.folio?r.folio+' · ':''}📅 ${r.fecha} · ${r.hora}</span><span class="chip" style="color:${cl}">${p}% cumplimiento</span></div>
    <div style="font-weight:700;font-size:17px">${esc(r.equipo)}</div>
    <div class="mut" style="margin:2px 0 10px">👤 ${esc(r.responsable||'-')}${r.supervisor?' · 👷 '+esc(r.supervisor):''} · ${r.items.length} actividades · ${nf} fotos</div>
    <div class="g3"><button class="btn" data-act="edit" data-id="${r.id}">✏️ Editar</button><button class="btn g" data-act="pdf" data-id="${r.id}">📄 PDF</button><button class="btn r" data-act="del" data-id="${r.id}">🗑️ Eliminar</button></div></div>`}).join('');

const txtRango=rg=>(S.desde&&S.hasta&&S.desde>S.hasta)?'La fecha inicial es posterior a la final':`Reportes en el rango: ${rg.length} de ${S.reportes.length}`;
const enRango=()=>S.reportes.filter(r=>(!S.desde||r.fecha>=S.desde)&&(!S.hasta||r.fecha<=S.hasta));
const opt=e=>ESTADOS.map(x=>`<option${x===e?' selected':''}>${x}</option>`).join('');
const COL={Pendiente:'var(--pen)',Cumple:'var(--ok)','No cumple':'var(--no)','N/A':'var(--na)'};
const BASE=['Inspección visual general','Lubricación','Revisión de bandas / rodillos','Limpieza del área','Condiciones de seguridad'];
const S={tab:'nuevo',plantillas:[{n:'General',items:BASE.slice()}],reportes:[],rep:null,t:0,filtro:'todos',desde:'',hasta:'',sfolio:'',sdesde:'',shasta:'',editId:null,xfotos:true,cal:'normal',equipos:[],planta:'',logo:'',dest:null,avisoCerrado:false,borrador:null,sel:new Set(),hints:true,prev:'nuevo'};
const $=s=>document.querySelector(s), app=$('#app');
let tt;function aviso(t){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',3500)}
window.alert=aviso;
function pregunta(t){return new Promise(res=>{const m=document.createElement('div');m.id='modal';m.innerHTML=`<div class="box"><p>${esc(t)}</p><button class="btn" data-v="1">✔️ Sí</button><button class="btn g" data-v="0">✖️ No</button></div>`;m.onclick=e=>{const v=e.target.dataset.v;if(v===undefined)return;m.remove();res(v==='1')};document.body.appendChild(m)})}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Almacenamiento (IndexedDB, con respaldo en memoria) */
let db=null;
function abrir(){return new Promise(res=>{try{const q=indexedDB.open('checklist',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{db=q.result;res()};q.onerror=()=>res()}catch(e){res()}})}
function kvGet(k){return new Promise(res=>{if(!db)return res();try{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res()}catch(e){res()}})}
function kvSet(k,v){return new Promise(res=>{if(!db)return res();try{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}

const lista=r=>{const c={};ESTADOS.forEach(e=>c[e]=r.items.filter(x=>x.estado===e).length);
  return `<div class="card"><div class="act">Actividades agregadas (${r.items.length})</div>`+(r.items.length?r.items.map((it,i)=>`<div class="row sec"><span class="mut">${i+1}.</span><span class="mut"><b>${it.folio}</b></span><a id="ln${i}" data-act="ir" data-i="${i}" style="flex:1;cursor:pointer;text-decoration:underline">${esc(it.texto)||'(sin nombre)'}</a><select data-es="${i}" style="width:128px;background:${COL[it.estado]};color:#fff;border:0;font-weight:600;padding:8px">${opt(it.estado)}</select></div>`).join(''):'<p class="mut">Aún no hay actividades.</p>')+`<div class="mut">${ESTADOS.map(e=>e+': '+c[e]).join(' · ')}</div></div>`};
const segTodos=()=>{const ls=[];S.reportes.forEach(r=>r.items.forEach((it,ii)=>{if(it.fotos.length||it.sinFotos)ls.push({r,it,ii})}));return ls};
function segItems(){const at=x=>x.it.atendido==='Atendido',q=(S.sfolio||'').trim();
  return segTodos().filter(x=>(S.filtro==='todos'||(S.filtro==='pend'?!at(x):S.filtro==='proc'?x.it.atendido==='En proceso':at(x)))&&(!q||String(x.it.folio||'').includes(q))&&(!S.sdesde||x.r.fecha>=S.sdesde)&&(!S.shasta||x.r.fecha<=S.shasta)).reverse().sort((a,b)=>prOrd(a)-prOrd(b))}
const segTxt=vis=>{const ls=segTodos(),pend=ls.filter(x=>x.it.atendido!=='Atendido').length,pr=ls.filter(x=>x.it.atendido==='En proceso').length;return `Mostrando ${vis.length} · Con fotos: ${ls.length} · Por atender: ${pend} (en proceso: ${pr}) · Atendidas: ${ls.length-pend}`};
const segCards=vis=>{const at=x=>x.it.atendido==='Atendido';
  return vis.length?vis.map(x=>{const pr=x.it.prioridad||'Media';return `<div class="ac" style="border-left-color:${PRC[pr]}${venc(x.it)?';outline:2px solid var(--no)':''}"><div class="row sec" style="flex-wrap:wrap;gap:6px"><input type="checkbox" data-sel="${x.r.id}|${x.ii}" ${S.sel.has(x.r.id+'|'+x.ii)?'checked':''} style="width:auto;margin:0 2px 0 0;min-height:0"><span class="chip">Folio ${x.it.folio||''}</span>${x.r.folio?`<span class="chip">${x.r.folio}</span>`:''}<span class="chip" style="background:${PRC[pr]};color:#fff;border-color:transparent">${pr}</span><span class="chip">📅 ${x.r.fecha}</span>${chipAt(x)}</div>
    <div style="font-weight:700;font-size:17px">${esc(x.it.texto)}</div><div class="mut" style="margin:2px 0 8px">🏭 ${esc(x.r.equipo)}${x.it.lista?' · '+esc(x.it.lista):''} · Estado: ${x.it.estado}</div>`+
    (x.it.fotos.length||(x.it.fotosDespues||[]).length?`<div class="fotos">`+x.it.fotos.map((f,j)=>`<div class="foto"><img src="${f.data}" alt="Foto ${j+1}"><div class="mut">${esc(f.desc)||'Sin descripción'}</div></div>`).join('')+(x.it.fotosDespues||[]).map(f=>`<div class="foto"><div class="lb">DESPUÉS</div><img src="${f.data}" alt="Foto después"></div>`).join('')+`</div>`:'')+
    (x.it.sinFotos&&!x.it.fotos.length?'<div class="mut">Fotos eliminadas para liberar espacio</div>':'')+
    `<label class="lb" style="margin-top:8px">📌 ¿Ya se atendió este hallazgo?</label><select data-at="${x.r.id}|${x.ii}" style="background:${at(x)?'var(--ok)':x.it.atendido==='En proceso'?'#d97706':'var(--no)'};color:#fff;border:0;font-weight:600">${['No atendido','En proceso','Atendido'].map(o=>`<option${(x.it.atendido||'No atendido')===o?' selected':''}>${o}</option>`).join('')}</select>${avanceHtml(x)}`+
    (at(x)?`<label class="lb" style="margin-top:8px">📆 Fecha en que se atendió</label><input type="date" class="pk" data-sx="${x.r.id}|${x.ii}|fechaAt" value="${x.it.fechaAt||''}" max="${hoyISO()}">`:'')+segExtra(x)+bitHtml(x.it)+`</div>`}).join(''):'<p class="mut">'+(segTodos().length?'No hay actividades que coincidan con la búsqueda.':'Aquí aparecerán las actividades que tengan fotos. Agrega fotos a una actividad en 📝 Nuevo reporte y guarda el reporte.')+'</p>'};
const seg=()=>{const vis=segItems();
  return `<p class="mut" id="sc">${segTxt(vis)}</p>
  <div class="sc"><div class="ttl">🔎 Buscar</div><label class="lb">Folio</label><input data-sq="sfolio" inputmode="numeric" placeholder="Ej. 48213" value="${esc(S.sfolio)}"><div class="g2"><div><label class="lb">📅 Desde</label><input type="date" data-sq="sdesde" value="${S.sdesde}"></div><div><label class="lb">📅 Hasta</label><input type="date" data-sq="shasta" value="${S.shasta}"></div></div><label class="lb" style="margin-top:10px">Estado de atención</label><select data-flt="1"><option value="todos"${S.filtro==='todos'?' selected':''}>Todas</option><option value="pend"${S.filtro==='pend'?' selected':''}>Por atender</option><option value="proc"${S.filtro==='proc'?' selected':''}>En proceso</option><option value="ok"${S.filtro==='ok'?' selected':''}>Atendidas</option></select><button class="btn g" data-act="sqlimpiar" style="width:100%;margin:10px 0 0">🧹 Limpiar búsqueda</button></div>
  <div class="sc"><div class="ttl">📤 Exportar y enviar</div><button class="btn" id="sbtn" data-act="segpdf" style="width:100%;margin:0 0 8px">📄 Exportar PDF (${vis.length})</button><div class="g2"><button class="btn g" data-act="wa">📲 WhatsApp</button><button class="btn g" data-act="waimg">🖼️ Con imágenes</button></div></div>
  <div class="sc"><div class="ttl">☑️ Cerrar varias a la vez</div><div class="mut" style="margin-bottom:8px">Marca las casillas de las actividades de abajo y ciérralas juntas.</div><div class="g2"><div><label class="lb">📆 Fecha de atención</label><input type="date" class="pk" id="bfecha" value="${hoyISO()}" max="${hoyISO()}"></div><div><label class="lb">👤 Atendió</label><input id="batendio" placeholder="Nombre"></div></div><div class="g2" style="margin-top:10px"><button class="btn g" data-act="selall">☑️ Seleccionar visibles</button><button class="btn g" data-act="selnone">⬜ Quitar selección</button></div><button class="btn" id="bbtn" data-act="bulk" style="width:100%;margin:10px 0 0">✅ Marcar atendidas (${S.sel.size})</button></div>
  <h3>✅ Actividades</h3><div id="sl">${segCards(vis)}</div>`};
const segRefresh=()=>{const vis=segItems();$('#sc').textContent=segTxt(vis);$('#sl').innerHTML=segCards(vis);$('#sbtn').textContent=`📄 Exportar PDF (${vis.length})`;selUpd()};

const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
const hoyISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const venc=it=>it.atendido!=='Atendido'&&it.compromiso&&it.compromiso<hoyISO();
const semana=f=>{const d=new Date(f+'T00:00:00'),t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=t.getUTCFullYear();return y+'-S'+String(Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)).padStart(2,'0')};
const dls=()=>{const a=[...new Set(S.reportes.flatMap(r=>r.items.map(i=>i.texto.trim())).filter(Boolean))];return `<datalist id="eqs">${S.equipos.map(e=>`<option value="${esc(e)}">`).join('')}</datalist><datalist id="acts">${a.map(e=>`<option value="${esc(e)}">`).join('')}</datalist>`};
const calSel=()=>`<select data-cal="1"><option value="normal"${S.cal==='normal'?' selected':''}>📷 Fotos: calidad normal</option><option value="ligera"${S.cal==='ligera'?' selected':''}>📷 Fotos: calidad ligera (menos peso)</option></select>`;
const segExtra=x=>{const k=`${x.r.id}|${x.ii}|`,it=x.it;return `<label class="lb" style="margin-top:12px">👤 Atendió</label><input data-sx="${k}atendio" placeholder="Nombre" value="${esc(it.atendio||'')}"><label class="lb">📝 Nota de cierre</label><textarea rows="2" data-sx="${k}nota" placeholder="Qué se hizo">${esc(it.nota||'')}</textarea><div class="g2"><div><label class="lb">🚦 Prioridad</label>${priSel(it,`data-sx="${k}prioridad"`)}</div><div><label class="lb">🗓️ Fecha compromiso</label><input type="date" class="pk" data-sx="${k}compromiso" value="${it.compromiso||''}"></div></div><button class="addf" data-act="fotod" data-rid="${x.r.id}" data-ii="${x.ii}" style="margin-top:10px">📷 Agregar foto del después</button>`+(venc(it)?'<div style="color:var(--no);font-weight:700;margin-top:8px">⚠️ Vencida</div>':'')};
const PRC={Alta:'var(--no)',Media:'#d97706',Baja:'#2563eb'};
const priSel=(it,attr)=>`<select ${attr} style="background:${PRC[it.prioridad||'Media']};color:#fff;border:0;font-weight:600">${['Alta','Media','Baja'].map(x=>`<option${(it.prioridad||'Media')===x?' selected':''}>${x}</option>`).join('')}</select>`;
const prOrd=x=>({Alta:0,Media:1,Baja:2})[x.it.prioridad||'Media'];
const rep2=()=>{const m={};S.reportes.forEach(r=>r.items.forEach(it=>{if(it.estado!=='No cumple')return;const k=norm(r.equipo)+'|'+norm(it.texto),o=m[k]||(m[k]={e:r.equipo,t:it.texto,n:0,f:[]});o.n++;o.f.push(r.fecha)}));
  const l=Object.values(m).filter(o=>o.n>=2).sort((a,b)=>b.n-a.n);
  return `<div class="sc"><div class="ttl">Actividades que fallan repetidamente</div>`+(l.length?l.map(o=>`<div class="sec"><b>${esc(o.t)}</b><div class="mut">${esc(o.e)} · ${o.n} veces No cumple · última ${o.f.sort().pop()}</div></div>`).join(''):'<p class="mut">Ninguna actividad tiene 2 o más fallas en el mismo equipo.</p>')+`</div>`};

async function guardarArchivo(nombre,data){
  let d=null;
  try{d=window.claude&&claude.use?await claude.use('downloads'):null}catch(x){d=null}
  if(d){try{await d.save({filename:nombre,data});return}catch(x){if(x.code==='declined')return}}
  const tipo=nombre.endsWith('.json')?'application/json':nombre.endsWith('.pdf')?'application/pdf':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const blob=new Blob([data],{type:tipo});
  if(/Android|iPhone|iPad/i.test(navigator.userAgent)&&navigator.canShare){
    try{const f=new File([blob],nombre,{type:tipo});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:nombre});return}}catch(x){if(x&&x.name==='AbortError')return}}
  const u=URL.createObjectURL(blob),l=document.createElement('a');
  l.href=u;l.download=nombre;document.body.appendChild(l);l.click();l.remove();
  setTimeout(()=>URL.revokeObjectURL(u),5000);aviso('Descargando '+nombre)}

    d.setFillColor(...PR[pr]);d.rect(M,y-3.5,1.5,ls.length*4.5+5.5,'F');txt(ls,M+5,y,{b:1,s:9.5});y+=ls.length*4.5;
    txt(`Folio ${x.it.folio}  ·  ${x.r.equipo}  ·  Prioridad ${pr}  ·  `+(x.it.compromiso?'Compromiso '+x.it.compromiso:'Sin fecha compromiso')+(v?'  ·  VENCIDA':''),M+5,y,{s:8,c:v?NO:GR});y+=7});
  y+=2;sec('Últimos reportes');
  S.reportes.slice().sort((a,b)=>(b.fecha+b.hora).localeCompare(a.fecha+a.hora)).slice(0,5).forEach(r=>{const a=r.items.length-r.items.filter(i=>i.estado==='N/A').length,p=a?Math.round(r.items.filter(i=>i.estado==='Cumple').length/a*100):0;need(12);
    txt(`${r.fecha}  ${r.equipo}`,M,y,{b:1,s:9});y+=4.5;txt(`Elaboró: ${r.responsable||'-'}  ·  ${r.items.length} actividades  ·  ${p}% cumplimiento  ·  ${r.items.reduce((q,i)=>q+i.fotos.length,0)} fotos`,M,y,{s:8,c:GR});y+=7});
  const tp=d.getNumberOfPages();
  for(let p=1;p<=tp;p++){d.setPage(p);
    if(p>1){d.setFillColor(...AZ);d.rect(0,0,W,12,'F');txt('Resumen de cumplimiento',M,7.5,{b:1,s:9,c:BL});txt(hoy,W-M,7.5,{s:9,c:BL,a:'right'})}
    d.setDrawColor(...LN);d.line(M,H-12,W-M,H-12);txt(`Página ${p} de ${tp}`,W-M,H-7,{s:8,c:GR,a:'right'})}
  await guardarArchivo(`Resumen_checklist_${hoyISO()}.pdf`,d.output('arraybuffer'))}

function normFoto(f){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0);res({data:c.toDataURL('image/jpeg',.85),w:c.width,h:c.height,desc:f.desc})};im.onerror=()=>rej(new Error('imagen ilegible'));im.src=f.data})}

async function exportarPDF(r){
  const {jsPDF}=window.jspdf,d=new jsPDF({unit:'mm',format:'a4'});
  const W=210,H=297,M=14,CW=W-2*M,TOP=22,BOT=H-17;
  const AZ=[30,58,95],GR=[107,114,128],LN=[209,213,219],CL=[243,244,246],BL=[255,255,255];
  const EC={'Cumple':[22,163,74],'No cumple':[220,38,38],'N/A':[107,114,128],'Pendiente':[156,163,175]};
  let fallos=0;const items=[];
  for(const it of r.items){const fotos=[];for(const f of (it.fotos||[])){try{fotos.push(await normFoto(f))}catch(e){fallos++}}items.push({...it,fotos})}
  const cnt={'Cumple':0,'No cumple':0,'N/A':0,'Pendiente':0};
  items.forEach(i=>cnt[i.estado]=(cnt[i.estado]||0)+1);
  const aplica=items.length-cnt['N/A'],pct=aplica?Math.round(cnt['Cumple']/aplica*100):0;
  let y=0;
  const need=n=>{if(y+n>BOT){d.addPage();y=TOP}};
  const txt=(t,x,yy,o={})=>{d.setFont('helvetica',o.b?'bold':'normal');d.setFontSize(o.s||10);d.setTextColor(...(o.c||[17,24,39]));d.text(t,x,yy,o.a?{align:o.a}:undefined)};

  /* Encabezado */
  d.setFillColor(...AZ);d.rect(0,0,W,30,'F');
  logoPDF(d,W,M);txt('REPORTE DE CHECKLIST',M,14,{b:1,s:18,c:BL});
  txt(S.planta||'Inspección y verificación de equipo',M,22,{s:10,c:[203,213,225]});
  txt(`${r.fecha}`,W-M-(S.logo?30:0),14,{b:1,s:11,c:BL,a:'right'});txt(r.folio||'',W-M-(S.logo?30:0),22,{s:10,c:[203,213,225],a:'right'});
  y=38;

  /* Datos generales */
  const cw=[CW*.42,CW*.36,CW*.22];let x0=M;
  d.setDrawColor(...LN);d.setFillColor(...CL);d.roundedRect(M,y,CW,19,2,2,'FD');
  [['EQUIPO / ÁREA',r.equipo],['ELABORÓ',r.responsable||'-'],['FECHA',r.fecha]].forEach(([k,v],n)=>{
    if(n>0){d.setDrawColor(...LN);d.line(x0,y+3.5,x0,y+15.5)}
    txt(k,x0+4,y+7,{b:1,s:7.5,c:GR});
    txt(d.splitTextToSize(String(v),cw[n]-8)[0],x0+4,y+13.5,{b:1,s:10});
    x0+=cw[n]});
  y+=25;

  /* Actividades por checklist */
  let ult=null,n=0;
  for(const it of items){
    const lista=it.lista||'Actividades';
    if(lista!==ult){ult=lista;need(26);y+=2;
      d.setFillColor(...AZ);d.rect(M,y,CW,7,'F');
      txt(lista.toUpperCase(),M+3,y+4.9,{b:1,s:9,c:BL});txt('ESTADO',W-M-3,y+4.9,{b:1,s:8,c:BL,a:'right'});y+=7}
    n++;
    d.setFont('helvetica','normal');d.setFontSize(10);
    const lines=d.splitTextToSize(it.texto,CW-54),rh=Math.max(9,lines.length*4.6+4.4);
    need(rh+(it.fotos.length?22:0));
    txt('FOLIO',M+3,y+3.8,{b:1,s:6.5,c:GR});txt(String(it.folio||''),M+3,y+8,{b:1,s:9,c:AZ});
    txt(lines,M+19,y+6,{s:10});
    const by=y+(rh-6.5)/2;
    d.setFillColor(...EC[it.estado]);d.roundedRect(W-M-31,by,28,6.5,1.5,1.5,'F');
    txt(it.estado,W-M-17,by+4.5,{b:1,s:8,c:BL,a:'center'});
    y+=rh;d.setDrawColor(...LN);d.line(M,y,W-M,y);

    if(it.fotos.length){
      const ok=it.atendido==='Atendido';
      txt('Atención: '+(ok?'Atendido'+(it.fechaAt?' ('+it.fechaAt+')':''):it.atendido==='En proceso'?'En proceso ('+(it.avance||0)+'%)':'No atendido'),M+12,y+5,{b:1,s:8.5,c:ok?EC['Cumple']:EC['No cumple']});y+=8;
      const pw=(CW-4)/2;
      for(let k=0;k<it.fotos.length;k+=2){
        d.setFont('helvetica','italic');d.setFontSize(8);
        const par=it.fotos.slice(k,k+2).map((f,q)=>{let w=pw,h=w*f.h/f.w;if(h>62){h=62;w=h*f.w/f.h}
          return{f,w,h,cap:[]}});
        const bh=Math.max(...par.map(p=>p.h+p.cap.length*3.8+3));
        need(bh+2);
        par.forEach((p,q)=>{const x=M+q*(pw+4);
          try{d.addImage(p.f.data,'JPEG',x,y,p.w,p.h);d.setDrawColor(...LN);d.rect(x,y,p.w,p.h)}catch(e){fallos++;d.setFillColor(...CL);d.rect(x,y,p.w,p.h,'F');txt('Imagen no disponible',x+p.w/2,y+p.h/2,{s:9,c:GR,a:'center'})}
          
          d.setFont('helvetica','italic');d.setFontSize(8);d.setTextColor(...GR);0});
        y+=bh+2}
      y+=1}
  }

  /* Encabezado de páginas y pie */
  const tp=d.getNumberOfPages();
  for(let p=1;p<=tp;p++){d.setPage(p);
    if(p>1){d.setFillColor(...AZ);d.rect(0,0,W,12,'F');
      txt('Reporte de checklist - '+r.equipo,M,7.5,{b:1,s:9,c:BL});txt(`${r.fecha}`,W-M,7.5,{s:9,c:BL,a:'right'})}
    d.setDrawColor(...LN);d.line(M,H-12,W-M,H-12);
    txt(`Página ${p} de ${tp}`,W-M,H-7,{s:8,c:GR,a:'right'})}

  await guardarArchivo(`Reporte_${r.fecha}_${r.equipo.replace(/[^\w-]+/g,'_')}.pdf`,d.output('arraybuffer'));
  if(fallos)aviso('Atención: '+fallos+' foto(s) no se pudieron incluir en el PDF');}

(async()=>{await abrir();const ps=await kvGet('plantillas'),p=await kvGet('plantilla'),r=await kvGet('reportes');if(ps)S.plantillas=ps;else if(p)S.plantillas=[{n:'General',items:p}];if(r)S.reportes=r;{const eq=await kvGet('equipos'),cl=await kvGet('cal'),cf=await kvGet('cfg');if(cf){S.planta=cf.planta||'';S.logo=cf.logo||''}if(eq)S.equipos=eq;if(cl)S.cal=cl;S.reportes.forEach(x=>{if(x.equipo&&!S.equipos.some(e=>norm(e)===norm(x.equipo)))S.equipos.push(x.equipo.trim())})}{const hh=await kvGet('hints');if(hh===false)S.hints=false}let ch=false;S.reportes.forEach(x=>x.items.forEach(it=>{if(!it.folio){it.folio=folioNuevo();ch=true}}));S.reportes.filter(x=>!x.folio).sort((a,b)=>(a.fecha+a.hora+a.id).localeCompare(b.fecha+b.hora+b.id)).forEach(x=>{x.folio=repFolio();ch=true});const bd0=await kvGet('borrador');if(bd0&&bd0.rep)S.borrador=bd0;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}if(ch)await kvSet('reportes',S.reportes);render();if(!(await kvGet('tour')))showTour(0)})();
</script>
